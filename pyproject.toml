[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "network-health-check"
version = "0.1.0"
description = "Educational & Production-Grade Network Health Check Automation System with Python and Cisco pyATS"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "cryptography<44",
    "pyats[library]>=25.10",
    "PyYAML>=6.0",
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/network_health/tests"]
pythonpath = ["src"]
addopts = "-v"
